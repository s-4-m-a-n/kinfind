{# Leaflet + the zones script. Include once per page that has a #zone-map. #}
{% macro head() %}<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">{% endmacro %}
{% macro scripts(zones) %}
<script type="application/json" id="zone-data">{{ zones|tojson }}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/zones.js"></script>
{% endmacro %}
